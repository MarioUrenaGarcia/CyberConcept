<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Demostración: aparecen unas siglas, se escribe su significado y se marca como correcto">
  <style>
    .card { fill: #121A2B; }
    .stripe { fill: #7A95FF; }
    .tile { fill: #1D2638; stroke: #2B3650; stroke-width: 1.5; }
    .tile-shadow { fill: #0B101A; }
    .letter { font: 800 46px "Arial Black", "Segoe UI Black", Arial, sans-serif; fill: #E9EDF5; text-anchor: middle; }
    .label { font: 500 15px "Segoe UI", Arial, sans-serif; fill: #A3AEC2; text-anchor: middle; }
    .typed { font: 600 24px Consolas, "Courier New", monospace; fill: #3FC48A; }
    .caret { fill: #3FC48A; }
    .check-bg { fill: #3FC48A; }
    .check { fill: none; stroke: #0F1522; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .footer { font: 500 14px "Segoe UI", Arial, sans-serif; fill: #6E7B93; text-anchor: middle; }

    .group { opacity: 0; animation: cycle 18s linear infinite; }
    .g2 { animation-delay: 6s; }
    .g3 { animation-delay: 12s; }
    @keyframes cycle {
      0% { opacity: 0; }
      2% { opacity: 1; }
      31% { opacity: 1; }
      33.3% { opacity: 0; }
      100% { opacity: 0; }
    }

    .tiles-in { animation: pop 18s ease-out infinite; }
    @keyframes pop {
      0% { transform: translateY(18px); }
      4% { transform: translateY(0); }
      100% { transform: translateY(0); }
    }

    .clip-rect { width: 0; animation: typing 18s infinite; }
    .c1 { animation-timing-function: steps(41, end); }
    .c2 { animation-timing-function: steps(17, end); }
    .c3 { animation-timing-function: steps(25, end); }
    @keyframes typing {
      0%, 6% { width: 0; }
      24% { width: var(--w); }
      100% { width: var(--w); }
    }

    .caret { animation: caretmove 18s infinite, blink 18s infinite; }
    @keyframes caretmove {
      0%, 6% { transform: translateX(0); }
      24% { transform: translateX(var(--w)); }
      100% { transform: translateX(var(--w)); }
    }
    @keyframes blink {
      0%, 5% { opacity: 0; }
      6%, 23% { opacity: 1; }
      24%, 100% { opacity: 0; }
    }

    .done { opacity: 0; animation: appear 18s ease-out infinite; }
    @keyframes appear {
      0%, 24.5% { opacity: 0; transform: scale(0.6); }
      26.5% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>

  <rect class="card" x="0" y="0" width="800" height="320" rx="18"/>
  <rect class="stripe" x="0" y="0" width="800" height="6"/>

  <!-- Grupo 1: SIEM -->
  <g class="group">
    <g class="tiles-in" style="transform-box: fill-box; transform-origin: center;">
      <g transform="translate(248 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">S</text>
      </g>
      <g transform="translate(326 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">I</text>
      </g>
      <g transform="translate(404 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">E</text>
      </g>
      <g transform="translate(482 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">M</text>
      </g>
    </g>
    <text class="label" x="400" y="162">Defensa y operaciones / Detección y respuesta</text>
    <clipPath id="clip1"><rect class="clip-rect c1" x="60" y="190" height="50" style="--w: 576px;"/></clipPath>
    <rect x="60" y="192" width="680" height="46" rx="10" fill="#171F31" stroke="#2B3650" stroke-width="1.5"/>
    <g clip-path="url(#clip1)">
      <text class="typed" x="76" y="223">Security Information and Event Management</text>
    </g>
    <rect class="caret" x="78" y="203" width="2" height="24" style="--w: 570px; animation-timing-function: steps(41, end), linear;"/>
    <g class="done" style="transform-box: fill-box; transform-origin: center;">
      <circle class="check-bg" cx="712" cy="215" r="14"/>
      <path class="check" d="M705 215.5l5 5 9.5-10"/>
    </g>
  </g>

  <!-- Grupo 2: MITM -->
  <g class="group g2">
    <g class="tiles-in" style="transform-box: fill-box; transform-origin: center; animation-delay: 6s;">
      <g transform="translate(248 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">M</text>
      </g>
      <g transform="translate(326 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">I</text>
      </g>
      <g transform="translate(404 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">T</text>
      </g>
      <g transform="translate(482 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">M</text>
      </g>
    </g>
    <text class="label" x="400" y="162">Ataques, malware y vulnerabilidades / Ataques de red</text>
    <clipPath id="clip2"><rect class="clip-rect c2" x="60" y="190" height="50" style="--w: 242px; animation-delay: 6s;"/></clipPath>
    <rect x="60" y="192" width="680" height="46" rx="10" fill="#171F31" stroke="#2B3650" stroke-width="1.5"/>
    <g clip-path="url(#clip2)">
      <text class="typed" x="76" y="223">Man-in-the-Middle</text>
    </g>
    <rect class="caret" x="78" y="203" width="2" height="24" style="--w: 236px; animation-delay: 6s; animation-timing-function: steps(17, end), linear;"/>
    <g class="done" style="transform-box: fill-box; transform-origin: center; animation-delay: 6s;">
      <circle class="check-bg" cx="712" cy="215" r="14"/>
      <path class="check" d="M705 215.5l5 5 9.5-10"/>
    </g>
  </g>

  <!-- Grupo 3: PKI -->
  <g class="group g3">
    <g class="tiles-in" style="transform-box: fill-box; transform-origin: center; animation-delay: 12s;">
      <g transform="translate(287 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">P</text>
      </g>
      <g transform="translate(365 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">K</text>
      </g>
      <g transform="translate(443 48)">
        <rect class="tile-shadow" x="0" y="5" width="66" height="72" rx="12"/><rect class="tile" x="0" y="0" width="66" height="72" rx="12"/><text class="letter" x="33" y="53">I</text>
      </g>
    </g>
    <text class="label" x="400" y="162">Criptografía / PKI y certificados</text>
    <clipPath id="clip3"><rect class="clip-rect c3" x="60" y="190" height="50" style="--w: 354px; animation-delay: 12s;"/></clipPath>
    <rect x="60" y="192" width="680" height="46" rx="10" fill="#171F31" stroke="#2B3650" stroke-width="1.5"/>
    <g clip-path="url(#clip3)">
      <text class="typed" x="76" y="223">Public Key Infrastructure</text>
    </g>
    <rect class="caret" x="78" y="203" width="2" height="24" style="--w: 348px; animation-delay: 12s; animation-timing-function: steps(25, end), linear;"/>
    <g class="done" style="transform-box: fill-box; transform-origin: center; animation-delay: 12s;">
      <circle class="check-bg" cx="712" cy="215" r="14"/>
      <path class="check" d="M705 215.5l5 5 9.5-10"/>
    </g>
  </g>

  <text class="footer" x="400" y="285">338 acrónimos en 11 categorías. Escribir, opción múltiple, inverso, mixto e infinito.</text>
</svg>
